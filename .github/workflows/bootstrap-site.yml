name: Bootstrap Illuminated Site

on:
  push:
    paths:
      - '.github/workflows/bootstrap-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Check out current Neuronaut website
        uses: actions/checkout@v4
        with:
          repository: neuroabw/neuroabw.github.io
          ref: main
          path: source

      - name: Copy Illuminated site without changing its contents
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            source/illuminated/ target/

      - name: Commit copied site
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Copy existing Illuminated site"
            git push
          fi
